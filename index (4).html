<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ციფრული ბიბლიოთეკა</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #f3f5fb;
  --surface: #ffffff;
  --ink: #1b2038;
  --muted: #6a7190;
  --line: #e3e6f2;
  --brand: #3b3fd8;
  --danger: #d6334b;
  --radius: 18px;
  --shadow: 0 6px 22px rgba(30, 40, 90, .10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: "Noto Sans Georgian", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: linear-gradient(160deg,#fff2dc 0%,#e6f2ff 45%,#f4e6ff 100%) fixed;
  color: var(--ink);
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid #8f93ff; outline-offset: 2px;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- ღილაკები ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: .95rem;
  transition: transform .12s, background .2s;
}
.btn:active { transform: scale(.97); }
.btn--primary { background: var(--brand); color: #fff; }
.btn--primary:hover { background: #2c30b8; }
.btn--ghost { background: #eceefa; color: var(--ink); }
.btn--ghost:hover { background: #dfe2f6; }
.btn--danger { background: #fde8ec; color: var(--danger); }
.btn--danger:hover { background: #fbd3db; }
.btn--block { width: 100%; padding: 14px; font-size: 1rem; }
.btn--sm { padding: 7px 12px; font-size: .85rem; }

/* ---------- შესვლა ---------- */
.login {
  min-height: 100vh; display: grid; place-items: center; padding: 20px;
  background:
    radial-gradient(circle at 15% 20%, #ffd86b55 0, transparent 40%),
    radial-gradient(circle at 85% 80%, #6bd1ff55 0, transparent 40%),
    linear-gradient(135deg, #3b3fd8, #7a3bd8);
}
.login__card {
  width: 100%; max-width: 400px; background: var(--surface);
  border-radius: 26px; padding: 34px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.28);
  text-align: center; display: grid; gap: 14px;
}
.login__logo { font-size: 3.2rem; }
.login__card h1 { font-size: 1.6rem; font-weight: 800; }
.login__sub { color: var(--muted); }
input, textarea {
  width: 100%; font: inherit; padding: 13px 14px; border-radius: 12px;
  border: 2px solid var(--line); background: #fbfcff; color: var(--ink);
}
input:focus, textarea:focus { border-color: var(--brand); }
.error { color: var(--danger); font-weight: 500; font-size: .92rem; text-align: left; }

/* ---------- ზედა ზოლი ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px clamp(14px, 4vw, 40px); padding-top: calc(12px + env(safe-area-inset-top));
  background: linear-gradient(90deg,#ff6b6b,#ffa94d,#38c9a0,#4c6fff,#a855f7);
  box-shadow: 0 4px 16px rgba(60,40,140,.25);
}
.topbar__brand { font-weight: 800; font-size: 1.15rem; display: flex; gap: 8px; align-items: center; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.3); }
.topbar .btn--ghost { background: rgba(255,255,255,.28); color: #fff; }
.topbar .btn--ghost:hover { background: rgba(255,255,255,.42); }
.topbar__user { display: flex; align-items: center; gap: 10px; }
.badge { padding: 5px 12px; border-radius: 999px; font-size: .8rem; font-weight: 700; background: #e6f7ee; color: #14804a; }
.badge--teacher { background: #fff1d6; color: #a15c00; }

.layout {
  max-width: 1440px; margin: 0 auto; padding: 0 clamp(12px, 3vw, 32px);
  display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 0 24px; align-items: start;
}
.container { min-width: 0; padding: 22px 0 60px; }

/* ---------- რეკომენდაციები (მარცხენა კუთხე) ---------- */
.recs { position: sticky; top: 78px; padding: 22px 0 40px; max-height: calc(100vh - 80px); overflow-y: auto; }
.recs__title { font-size: 1rem; font-weight: 800; margin-bottom: 10px; }
.recs__list { display: grid; gap: 9px; }
.rec {
  --c: #3b3fd8;
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; color: #fff;
  text-decoration: none; background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 65%, #000));
  box-shadow: 0 4px 12px rgba(30,40,90,.15); transition: transform .15s;
}
.rec:hover { transform: translateX(4px); }
.rec__icon { font-size: 1.5rem; flex: none; }
.rec__text { display: grid; line-height: 1.25; min-width: 0; flex: 1; }
.rec__text b { font-size: .88rem; }
.rec__text small { font-size: .74rem; opacity: .9; }
.rec__go { font-weight: 800; opacity: .9; }

.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 18px; color: var(--muted); font-size: .95rem; }
.crumbs button { color: var(--brand); font-weight: 700; padding: 4px 0; }
.crumbs span.sep { opacity: .5; }

.page-title { font-size: clamp(1.4rem, 4vw, 2.1rem); font-weight: 800; margin-bottom: 6px; }
.page-sub { color: var(--muted); margin-bottom: 22px; }

/* ---------- საგნების / კლასების ბადე ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

.tile {
  --c: #3b3fd8;
  position: relative; text-align: left; color: #fff; border-radius: var(--radius);
  padding: 18px 16px; min-height: 130px; display: flex; flex-direction: column; justify-content: space-between;
  background: linear-gradient(145deg, var(--c), color-mix(in srgb, var(--c) 70%, #000));
  box-shadow: var(--shadow); overflow: hidden;
  transition: transform .15s, box-shadow .15s;
}
.tile:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(30,40,90,.18); }
.tile::after {
  content: ""; position: absolute; right: -28px; bottom: -28px; width: 100px; height: 100px;
  border-radius: 50%; background: rgba(255,255,255,.16);
}
.tile__icon { font-size: 2rem; line-height: 1; }
.tile__name { font-weight: 800; font-size: 1.02rem; line-height: 1.25; position: relative; z-index: 1; }
.tile__count { font-size: .82rem; opacity: .9; position: relative; z-index: 1; }

.grid--grades { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.tile--grade { min-height: 110px; align-items: flex-start; }
.tile__num { font-size: 2.4rem; font-weight: 800; line-height: 1; position: relative; z-index: 1; }

/* ---------- წიგნები ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.books { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.book {
  --c: #3b3fd8;
  background: color-mix(in srgb, var(--c) 9%, #fff); border-radius: var(--radius); box-shadow: var(--shadow);
  border-top: 6px solid var(--c); padding: 18px; display: flex; flex-direction: column; gap: 10px;
}
.book h3 { font-size: 1.08rem; font-weight: 800; overflow-wrap: anywhere; }
.book p { color: var(--muted); font-size: .93rem; overflow-wrap: anywhere; }
.book__actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
.book .btn--open { background: var(--c); color: #fff; }

.empty { text-align: center; background: var(--surface); border: 2px dashed var(--line); border-radius: var(--radius); padding: 40px 20px; color: var(--muted); }
.empty .big { font-size: 2.6rem; }

/* ---------- ფანჯარა ---------- */
.dialog { border: 0; border-radius: 22px; padding: 24px; width: min(94vw, 480px); margin: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.dialog::backdrop { background: rgba(20, 24, 50, .55); }
.dialog form { display: grid; gap: 10px; }
.dialog h2 { font-size: 1.3rem; margin-bottom: 4px; }
.dialog label { font-weight: 700; font-size: .9rem; }
.dialog__actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px);
  background: #1b2038; color: #fff; padding: 12px 20px; border-radius: 12px; opacity: 0;
  pointer-events: none; transition: .25s; z-index: 50; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- პატარა ეკრანები ---------- */
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .recs { position: static; max-height: none; padding: 14px 0 0; overflow: visible; }
  .recs__list { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 8px; scroll-snap-type: x proximity; }
  .rec { flex: none; width: 210px; scroll-snap-align: start; }
  .rec:hover { transform: none; }
  .container { padding-top: 12px; }
}
@media (max-width: 480px) {
  .topbar__brand span { display: none; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .grid--grades { grid-template-columns: repeat(3, 1fr); }
  .tile { min-height: 118px; padding: 14px 12px; }
  .books { grid-template-columns: 1fr; }
}
@media (min-width: 1200px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}


/* ---------- მასალის ტიპები ---------- */
.grid--types { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.tile--type { min-height: 160px; }
.tile--type .tile__icon { font-size: 3rem; }
.tile--type .tile__name { font-size: 1.15rem; }
@media (max-width: 480px) {
  .grid--types { grid-template-columns: 1fr; }
  .tile--type { min-height: 120px; flex-direction: row; align-items: center; gap: 14px; justify-content: flex-start; }
}

</style>
</head>
<body>

  <!-- შესვლის გვერდი -->
  <section id="loginView" class="login">
    <form id="loginForm" class="login__card" novalidate>
      <div class="login__logo" aria-hidden="true">📚</div>
      <h1>ციფრული ბიბლიოთეკა</h1>

      <button id="loginBtn" type="submit" class="btn btn--primary btn--block">შესვლა</button>

  <!-- მთავარი აპლიკაცია -->
  <div id="appView" hidden>

      <button id="homeBtn" class="topbar__brand" type="button">📚 <span>ბიბლიოთეკა</span></button>
      <div class="topbar__user">
        <span id="roleBadge" class="badge"></span>
        <button id="logoutBtn" class="btn btn--ghost" type="button">გასვლა</button>
      </div>

    <div class="layout">
      <aside class="recs" aria-label="რეკომენდაციები">

        <div id="recList" class="recs__list"></div>
      </aside>
      <main class="container">
        <nav id="crumbs" class="crumbs" aria-label="ნავიგაცია"></nav>
        <div id="content"></div>
      </main>
    </div>
  </div>

  <!-- წიგნის დამატების / რედაქტირების ფანჯარა -->
  <dialog id="bookDialog" class="dialog">
    <form id="bookForm" method="dialog" novalidate>
      <h2 id="dialogTitle">მასალის დამატება</h2>
      <label for="bookTitle">სათაური</label>
      <input id="bookTitle" type="text" maxlength="150" required>
      <label for="bookUrl">ლინკი</label>
      <input id="bookUrl" type="text" placeholder="https://..." required>
      <label for="bookDesc">აღწერა (არასავალდებულო)</label>
      <textarea id="bookDesc" rows="3" maxlength="400"></textarea>
      <p id="bookError" class="error" hidden></p>
      <div class="dialog__actions">
        <button type="button" id="cancelBook" class="btn btn--ghost">გაუქმება</button>
        <button type="submit" class="btn btn--primary">შენახვა</button>
      </div>
    </form>
  </dialog>

  <!-- წაშლის დადასტურება -->
  <dialog id="confirmDialog" class="dialog">
    <h2>წაშლა</h2>
    <p id="confirmText" style="margin:10px 0 4px"></p>
    <div class="dialog__actions">
      <button type="button" id="confirmNo" class="btn btn--ghost">გაუქმება</button>
      <button type="button" id="confirmYes" class="btn btn--danger">წაშლა</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
/* თუ მთავარი კოდი ვერ ჩაიტვირთა, ცარიელი ეკრანის მაგივრად მიზეზს გამოვაჩენთ */
window.addEventListener("error", function (e) {
  var el = document.getElementById("loginError");
  if (!el) return;
  var t = e && e.target;
  var msg;
  if (t && t !== window && t.tagName) {
    if (t.tagName !== "SCRIPT") return;            // შრიფტი/სტილი არ არის კრიტიკული
    msg = "Firebase-ის ბიბლიოთეკა ვერ ჩაიტვირთა";
    if (location.protocol === "file:") msg += " — საიტი ფაილიდან არის გახსნილი. გახსენი GitHub Pages-ის მისამართით (https://...github.io/...)";
    else msg += " — შეამოწმე ინტერნეტი ან გახსენი სხვა ბრაუზერით";
  } else {
    msg = "შეცდომა: " + (e && e.message ? e.message : "უცნობი");
  }
  el.textContent = msg;
  el.hidden = false;
}, true);
</script>

/* ================= FIREBASE — აქ ჩასვი შენი კონფიგურაცია ================= */
/* Firebase Console → Project settings → Your apps → Web app → firebaseConfig */
const firebaseConfig = {

const db = getFirestore(app);
const booksCol = collection(db, "books");

/* ================= კონფიგურაცია ================= */
/* მხოლოდ ინტერფეისისთვის (რა ღილაკები გამოჩნდეს). რეალურ დაცვას Firestore-ის წესები ქმნის. */

/* ================= მონაცემები (Firestore — საერთო ბაზა) ================= */
let books = [];
let unsubscribe = null;

function startListening() {
  stopListening();
  unsubscribe = onSnapshot(booksCol, (snap) => {
    books = snap.docs.map((d) => {
      const data = d.data();
      return { ...data, id: d.id, type: data.type || "read" };
    });
    render(true);
  }, (err) => {
    console.error(err);
    toast("მონაცემების ჩატვირთვა ვერ მოხერხდა");

}
function stopListening() {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
}

function normalizeUrl(u) {
  u = u.trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try { return new URL(u).href; } catch (e) { return ""; }
}

  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

const RECS = [
  { title: "ქართული ლიტერატურა", desc: "ვიკიწყარო — ტექსტები", url: "https://ka.wikisource.org", icon: "📜", color: "#d6334b" },
  { title: "Khan Academy", desc: "უფასო გაკვეთილები", url: "https://www.khanacademy.org", icon: "🎓", color: "#14a76c" },
  { title: "Project Gutenberg", desc: "უფასო წიგნები", url: "https://www.gutenberg.org", icon: "📚", color: "#e8590c" },
  { title: "Open Library", desc: "მილიონობით წიგნი", url: "https://openlibrary.org", icon: "🔎", color: "#3b3fd8" },
  { title: "საპარლამენტო ბიბლიოთეკა", desc: "ეროვნული ბიბლიოთეკა", url: "https://www.nplg.gov.ge", icon: "🏛️", color: "#9c27b0" },
  { title: "განათლების სამინისტრო", desc: "სასწავლო რესურსები", url: "https://mes.gov.ge", icon: "🏫", color: "#0f8fa8" }
];

function renderRecs() {
  $("#recList").innerHTML = RECS.map((r) => `
    <a class="rec" style="--c:${r.color}" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">
      <span class="rec__icon" aria-hidden="true">${r.icon}</span>
      <span class="rec__text"><b>${esc(r.title)}</b><small>${esc(r.desc)}</small></span>
      <span class="rec__go" aria-hidden="true">↗</span>
    </a>`).join("");
}

/* ================= ავტორიზაცია ================= */
let loginMsg = "";

function authMessage(err) {
  switch (err && err.code) {
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found":
    case "auth/invalid-email": return "ელფოსტა ან პაროლი არასწორია";
    case "auth/too-many-requests": return "ძალიან ბევრი მცდელობა, სცადე მოგვიანებით";
    case "auth/network-request-failed": return "ინტერნეტთან კავშირი არ არის";
    case "auth/invalid-api-key":
    case "auth/api-key-not-valid.-please-pass-a-valid-api-key.": return "Firebase-ის კონფიგურაცია არასწორია";
    default: return "შესვლა ვერ მოხერხდა";
  }
}
function startSession(email, role) {
  currentUser = { email, role };
  if (!location.hash) location.hash = "#/";
  showApp();
  startListening();
}
function logout() { signOut(auth); }

/* ორივე — მოსწავლეც და მასწავლებელიც — შედის ელფოსტით და პაროლით */
onAuthStateChanged(auth, (user) => {
  if (user) {
    const email = (user.email || "").toLowerCase();
    const role = USERS[email];
    if (!role) {
      loginMsg = "ეს ანგარიში ბიბლიოთეკაში დაშვებული არ არის";
      signOut(auth);
      return;
    }
    startSession(email, role);
  } else {
    currentUser = null;
    stopListening();
    books = [];
    showLogin();
  }
});

function showLogin() {
  $("#appView").hidden = true;
  $("#loginView").hidden = false;
  $("#emailInput").value = "";
  $("#passInput").value = "";
  const er = $("#loginError");
  if (loginMsg) { er.textContent = loginMsg; er.hidden = false; loginMsg = ""; }
  else er.hidden = true;
}
function showApp() {
  $("#loginView").hidden = true;
  $("#appView").hidden = false;
  const badge = $("#roleBadge");
  badge.textContent = isTeacher() ? "მასწავლებელი" : "მოსწავლე";
  badge.className = "badge" + (isTeacher() ? " badge--teacher" : "");
  renderRecs();
  render();
}

/* ================= რაუტინგი (#/ , #/საგანი , #/საგანი/კლასი) ================= */
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const subject = parts[0] && subjectById(parts[0]) ? parts[0] : null;
  const g = parseInt(parts[1], 10);
  const grade = subject && g >= 1 && g <= 12 ? g : null;
  const type = grade && parts[2] && typeById(parts[2]) ? parts[2] : null;
  return { subject, grade, type };
}
function go(hash) { location.hash = hash; }

function render(keepScroll) {
  if (!currentUser) return;
  const { subject, grade, type } = route();
  const c = $("#content");
  if (!subject) renderSubjects(c);
  else if (!grade) renderGrades(c, subject);
  else if (!type) renderTypes(c, subject, grade);
  else renderBooks(c, subject, grade, type);
  if (!keepScroll) window.scrollTo({ top: 0 });
}

function renderCrumbs(subject, grade, type) {
  const nav = $("#crumbs");
  const sep = `<span class="sep">›</span>`;
  const parts = [`<button data-go="">საგნები</button>`];
  if (subject) {
    const s = subjectById(subject);
    parts.push(sep, grade ? `<button data-go="${subject}">${esc(s.name)}</button>` : `<span>${esc(s.name)}</span>`);
  }
  if (grade) parts.push(sep, type ? `<button data-go="${subject}/${grade}">${grade} კლასი</button>` : `<span>${grade} კლასი</span>`);
  if (type) parts.push(sep, `<span>${esc(typeById(type).name)}</span>`);
  nav.innerHTML = parts.join("");
  nav.querySelectorAll("[data-go]").forEach((b) =>
    b.addEventListener("click", () => go("#/" + b.dataset.go)));
}

/* ---------- საგნები ---------- */
function renderSubjects(c) {
  renderCrumbs();
  c.innerHTML = `
    <h1 class="page-title">აირჩიე საგანი</h1>
    <p class="page-sub">ყველა სასკოლო საგანი ერთ სივრცეში</p>
    <div class="grid">
      ${SUBJECTS.map((s) => `
        <button class="tile" style="--c:${s.color}" data-subject="${s.id}">
          <span class="tile__icon" aria-hidden="true">${s.icon}</span>
          <span>
            <span class="tile__name">${esc(s.name)}</span><br>
            <span class="tile__count">${countBooks(s.id)} წიგნი</span>
          </span>
        </button>`).join("")}
    </div>`;
  c.querySelectorAll("[data-subject]").forEach((b) =>
    b.addEventListener("click", () => go("#/" + b.dataset.subject)));
}

/* ---------- კლასები ---------- */
function renderGrades(c, subjectId) {
  const s = subjectById(subjectId);
  renderCrumbs(subjectId);
  c.innerHTML = `
    <h1 class="page-title">${s.icon} ${esc(s.name)}</h1>
    <p class="page-sub">აირჩიე კლასი</p>
    <div class="grid grid--grades">
      ${GRADES.map((g) => `
        <button class="tile tile--grade" style="--c:${s.color}" data-grade="${g}">
          <span class="tile__num">${g}</span>
          <span>
            <span class="tile__name">კლასი</span><br>
            <span class="tile__count">${countBooks(subjectId, g)} წიგნი</span>
          </span>
        </button>`).join("")}
    </div>`;
  c.querySelectorAll("[data-grade]").forEach((b) =>
    b.addEventListener("click", () => go(`#/${subjectId}/${b.dataset.grade}`)));
}

/* ---------- მასალის ტიპები ---------- */
function renderTypes(c, subjectId, grade) {
  const s = subjectById(subjectId);
  renderCrumbs(subjectId, grade);
  c.innerHTML = `
    <h1 class="page-title">${s.icon} ${esc(s.name)} — ${grade} კლასი</h1>
    <p class="page-sub">აირჩიე მასალის ტიპი</p>
    <div class="grid grid--types">
      ${TYPES.map((t) => `
        <button class="tile tile--type" style="--c:${t.color}" data-type="${t.id}">
          <span class="tile__icon" aria-hidden="true">${t.icon}</span>
          <span>
            <span class="tile__name">${t.name}</span><br>
            <span class="tile__count">${countBooks(subjectId, grade, t.id)} ლინკი</span>
          </span>
        </button>`).join("")}
    </div>`;
  c.querySelectorAll("[data-type]").forEach((b) =>
    b.addEventListener("click", () => go(`#/${subjectId}/${grade}/${b.dataset.type}`)));
}

/* ---------- ლინკები ---------- */
function renderBooks(c, subjectId, grade, type) {
  const s = subjectById(subjectId);
  const tp = typeById(type);
  renderCrumbs(subjectId, grade, type);
  const list = books
    .filter((b) => b.subject === subjectId && b.grade === grade && b.type === type)
    .sort((a, b) => b.createdAt - a.createdAt);

  const teacherBar = isTeacher()
    ? `<div class="toolbar">
         <button class="btn btn--primary" id="addBookBtn">＋ ლინკის დამატება</button>
         <button class="btn btn--ghost" id="exportBtn">⬇ ასლის შენახვა</button>
         <button class="btn btn--ghost" id="importBtn">⬆ ასლის აღდგენა</button>
         <input type="file" id="importFile" accept="application/json" hidden>
       </div>` : "";

  c.innerHTML = `
    <h1 class="page-title">${tp.icon} ${tp.name}</h1>
    <p class="page-sub">${esc(s.name)} — ${grade} კლასი${list.length ? " · " + list.length + " ლინკი" : ""}</p>
    ${teacherBar}
    ${list.length ? `<div class="books">${list.map((b) => bookCard(b, s)).join("")}</div>` : `
      <div class="empty">
        <div class="big">📭</div>
        <p>${isTeacher() ? "ჯერ არაფერი დამატებულა. დააჭირე „ლინკის დამატებას“." : "მასწავლებელს ამ განყოფილებაში ჯერ არაფერი ატვირთავს."}</p>
      </div>`}`;

  c.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openDialog(b.dataset.edit)));
  c.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => deleteBook(b.dataset.del)));
  if (isTeacher()) {
    $("#addBookBtn").addEventListener("click", () => openDialog(null));
    $("#exportBtn").addEventListener("click", exportBackup);
    $("#importBtn").addEventListener("click", () => $("#importFile").click());
    $("#importFile").addEventListener("change", importBackup);
  }
}

function bookCard(b, s) {
  return `
    <article class="book" style="--c:${s.color}">
      <h3>${esc(b.title)}</h3>
      ${b.desc ? `<p>${esc(b.desc)}</p>` : ""}
      <div class="book__actions">
        <a class="btn btn--sm btn--open" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">${typeById(b.type).action}</a>
        ${isTeacher() ? `
          <button class="btn btn--sm btn--ghost" data-edit="${b.id}">✏️ რედაქტირება</button>
          <button class="btn btn--sm btn--danger" data-del="${b.id}">🗑 წაშლა</button>` : ""}
      </div>
    </article>`;
}

/* ================= მასწავლებლის ფუნქციები ================= */
const dialog = $("#bookDialog");

function openDialog(id) {
  if (!isTeacher()) return;
  editingId = id;
  const b = id ? books.find((x) => x.id === id) : null;
  $("#dialogTitle").textContent = b ? "მასალის რედაქტირება" : "მასალის დამატება";
  $("#bookTitle").value = b ? b.title : "";
  $("#bookUrl").value = b ? b.url : "";
  $("#bookDesc").value = b ? b.desc : "";
  $("#bookError").hidden = true;
  dialog.showModal();
  $("#bookTitle").focus();
}

async function saveBookFromForm() {
  if (!isTeacher()) return;
  const title = $("#bookTitle").value.trim();
  const url = normalizeUrl($("#bookUrl").value);
  const desc = $("#bookDesc").value.trim();
  const err = $("#bookError");

  if (!title) { err.textContent = "შეიყვანე სათაური"; err.hidden = false; return; }
  if (!url)   { err.textContent = "ლინკი არასწორია"; err.hidden = false; return; }

  const wasEditing = !!editingId;
  try {
    if (wasEditing) {
      await updateDoc(doc(db, "books", editingId), { title, url, desc });
    } else {
      const { subject, grade, type } = route();
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      await setDoc(doc(db, "books", id), { subject, grade, type, title, url, desc, createdAt: Date.now() });
    }
    dialog.close();
    toast(wasEditing ? "ცვლილება შენახულია" : "მასალა დაემატა");
  } catch (e) {
    console.error(e);
    err.textContent = "შენახვა ვერ მოხერხდა — შეამოწმე ინტერნეტი ან უფლებები";
    err.hidden = false;
  }
}

function deleteBook(id) {
  if (!isTeacher()) return;
  const b = books.find((x) => x.id === id);
  if (!b) return;
  pendingDeleteId = id;
  $("#confirmText").textContent = `წაიშალოს „${b.title}“?`;
  $("#confirmDialog").showModal();
}

let pendingDeleteId = null;
async function confirmDelete() {
  if (!isTeacher() || !pendingDeleteId) return;
  const id = pendingDeleteId;
  pendingDeleteId = null;
  $("#confirmDialog").close();
  try { await deleteDoc(doc(db, "books", id)); toast("მასალა წაიშალა"); }
  catch (e) { console.error(e); toast("წაშლა ვერ მოხერხდა"); }
}

/* ---------- სარეზერვო ასლი ---------- */
function exportBackup() {
  const blob = new Blob([JSON.stringify(books, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "library-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importBackup(e) {
  if (!isTeacher()) return;
  const input = e.target;
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error();
      const ids = new Set(books.map((b) => b.id));
      const fresh = data
        .filter((b) => b && b.id && b.title && b.url && subjectById(b.subject) && !ids.has(String(b.id)))
        .map((b) => ({
          id: String(b.id).replace(/[^\w-]/g, "") || (Date.now().toString(36) + Math.random().toString(36).slice(2, 7)),
          subject: b.subject,
          grade: parseInt(b.grade, 10),
          type: typeById(b.type) ? b.type : "read",
          title: String(b.title).slice(0, 150),
          url: normalizeUrl(String(b.url)),
          desc: String(b.desc || "").slice(0, 400),
          createdAt: Number(b.createdAt) || Date.now()
        }))
        .filter((b) => b.url && b.grade >= 1 && b.grade <= 12);
      for (let i = 0; i < fresh.length; i += 400) {
        const batch = writeBatch(db);
        fresh.slice(i, i + 400).forEach(({ id, ...rest }) => batch.set(doc(db, "books", id), rest));
        await batch.commit();
      }
      toast(`აღდგა ${fresh.length} მასალა`);
    } catch (err) { console.error(err); toast("ფაილი არასწორია"); }
    input.value = "";
  };
  reader.readAsText(file);
}

/* ================= ივენთები ================= */
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const er = $("#loginError");
  const email = $("#emailInput").value.trim().toLowerCase();
  const pass = $("#passInput").value;
  if (!email || !pass) { er.textContent = "შეიყვანე ელფოსტა და პაროლი"; er.hidden = false; return; }
  er.hidden = true;
  const btn = $("#loginBtn");
  btn.disabled = true;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (err) {
    er.textContent = authMessage(err);
    er.hidden = false;
  } finally {
    btn.disabled = false;
  }
});
$("#logoutBtn").addEventListener("click", logout);
$("#homeBtn").addEventListener("click", () => go("#/"));
$("#bookForm").addEventListener("submit", (e) => { e.preventDefault(); saveBookFromForm(); });
$("#cancelBook").addEventListener("click", () => dialog.close());
$("#confirmYes").addEventListener("click", confirmDelete);
$("#confirmNo").addEventListener("click", () => { pendingDeleteId = null; $("#confirmDialog").close(); });
window.addEventListener("hashchange", () => render());

</script>
